name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: groupfuzz
        working-directory: groupfuzz
        run: go vet ./... && go test -short ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzMessage, FuzzKeyPackage, FuzzRatchetTree, FuzzWelcome, FuzzGroupInfo, FuzzProposal, FuzzProposalList, FuzzTreeVerify, FuzzUnprotect]
        pkg: [.]
        include:
          - target: FuzzCredential
            pkg: ./multicred
          - target: FuzzGroup
            pkg: .
            dir: groupfuzz
    defaults:
      run:
        working-directory: ${{ matrix.dir || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: check the target exists
        run: go test -list '^${{ matrix.target }}$' ${{ matrix.pkg }} | grep -qx '${{ matrix.target }}'
      # Carry each target's generated corpus from run to run. The key
      # is new every run, so every run saves; restore-keys picks up the
      # latest save for the target.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 1m ${{ matrix.pkg }}
      # A failing input is written to testdata/fuzz in the checkout.
      # Keep it, to commit as a regression test.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: '**/testdata/fuzz/'
