name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [FuzzMLSMessage, FuzzKeyPackage, FuzzRatchetTree, FuzzWelcome, FuzzGroupInfo, FuzzProposal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go test -run ^$ -fuzz ${{ matrix.target }} -fuzztime 2m
